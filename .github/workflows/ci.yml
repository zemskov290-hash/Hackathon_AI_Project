name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          # Same suite with the optional readers installed. The summary must
          # not change when pypdf and openpyxl are present.
          - os: ubuntu-latest
            extras: optional
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Optional reader packages
        if: matrix.extras == 'optional'
        run: python -m pip install pypdf openpyxl
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check the worked example
        run: python scripts/strat.py check projects/_example
      - name: Check the demo snapshot
        run: python scripts/strat.py check projects/demo-family-tariffs
      - name: Check the committed demo
        run: python scripts/strat.py check projects/demo-family-tariffs
      - name: Check the analysis demo
        run: python scripts/strat.py check projects/demo-analysis
      - name: Portability matrix
        run: python scripts/portability.py --check
      - name: Benchmark summary matches the committed empty table
        run: python scripts/bench.py summary --check
      - name: Classifier summary stays reproducible without an API key
        run: python scripts/classify_bench.py summary --check
